events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Dynamic map for WebSocket upgrade handling:
    # Sets Connection header to "upgrade" if $http_upgrade is present,
    # otherwise defaults to "close" for normal HTTP requests and Socket.IO long-polling.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name localhost;

        # Client body size limit for document uploads/updates
        client_max_body_size 50M;

        # Frontend production SPA
        location / {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend REST API
        location /api/ {
            proxy_pass http://backend:5000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Socket.IO Gateway (HTTP long-polling fallback + WebSocket upgrade)
        location /socket.io/ {
            proxy_pass http://backend:5000;
            proxy_http_version 1.1;

            # Dynamic WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering for real-time responsiveness
            proxy_buffering off;

            # 24-hour timeout for long-lived WebSocket sessions
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
